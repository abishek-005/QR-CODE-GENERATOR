<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#8A5CFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />

  <!-- Outer QR Finder Box Top-Left -->
  <rect x="100" y="100" width="112" height="112" rx="28" fill="none" stroke="url(#accentGrad)" stroke-width="20" filter="url(#glow)" />
  <rect x="132" y="132" width="48" height="48" rx="12" fill="url(#accentGrad)" />

  <!-- Outer QR Finder Box Top-Right -->
  <rect x="300" y="100" width="112" height="112" rx="28" fill="none" stroke="url(#accentGrad)" stroke-width="20" filter="url(#glow)" />
  <rect x="332" y="132" width="48" height="48" rx="12" fill="url(#accentGrad)" />

  <!-- Outer QR Finder Box Bottom-Left -->
  <rect x="100" y="300" width="112" height="112" rx="28" fill="none" stroke="url(#accentGrad)" stroke-width="20" filter="url(#glow)" />
  <rect x="132" y="332" width="48" height="48" rx="12" fill="url(#accentGrad)" />

  <!-- Micro QR Modules Grid (Bottom Right & Center) -->
  <rect x="300" y="300" width="40" height="40" rx="10" fill="#00D4FF" />
  <rect x="372" y="300" width="40" height="40" rx="10" fill="#6C63FF" />
  <rect x="300" y="372" width="40" height="40" rx="10" fill="#8A5CFF" />
  <rect x="372" y="372" width="40" height="40" rx="10" fill="#00D4FF" />

  <!-- Center Decorative Glow Sparkle -->
  <circle cx="256" cy="256" r="18" fill="#FFFFFF" filter="url(#glow)" />
</svg>
